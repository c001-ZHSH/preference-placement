  <script>
    var yearWorksMap = {};
    var selectedIds = {};
    var searchSelectedIds = {};

    function onUserLoaded(user) {
      if (!user.isAdmin) { showToast('您沒有管理員權限', 'error'); return; }

      // 1. 立即從快取渲染（秒開）
      var cachedAdmin = loadCache('adminData', 120000);
      if (cachedAdmin) {
        applyAdminData(cachedAdmin);
      }

      // 2. 背景呼叫 API 取最新資料
      callApi('getAdminPageData', {}, function(data) {
        if (data.user) applyUserInfo(data.user);
        saveCache('adminData', data);
        applyAdminData(data);
      });
    }

    function applyAdminData(data) {
      // 系統設定
      if (data.settings) {
        document.getElementById('setting-maxWorks').value = data.settings.maxWorksPerStudent || 0;
        document.getElementById('setting-maxDocSize').value = data.settings.maxDocSize || 4;
        document.getElementById('setting-maxVideoSize').value = data.settings.maxVideoSize || 10;
      }
      // 統計
      document.getElementById('stat-total').textContent = data.statistics.totalWorks;
      document.getElementById('stat-students').textContent = data.statistics.totalStudents;
      document.getElementById('stat-pdf').textContent = data.statistics.typeStats.pdf;
      document.getElementById('stat-video').textContent = data.statistics.typeStats.video;
      renderYearStats(data.statistics.yearStats);
      // 年份下拉
      var select = document.getElementById('year-select');
      select.innerHTML = '<option value="">-- 選擇入學年份 --</option>';
      data.statistics.yearStats.forEach(function(stat) {
        var opt = document.createElement('option');
        opt.value = stat.year;
        opt.textContent = stat.label + (stat.year > 0 ? (stat.isGraduated ? ' (已畢業)' : ' (在學中)') : '') + ' - ' + stat.workCount + ' 件作品';
        select.appendChild(opt);
      });
      // 類別
      categoriesList = data.categories;
      renderCategories(data.categories);
      populateBulkCategories(data.categories);
    }

    // ============================
    // 批次上傳（逐筆新增 → 一鍵上傳）
    // ============================
    var bulkQueue = []; // { file, category, title, desc }

    // ============================
    // 系統設定
    // ============================
    function saveSettings() {
      var maxWorks = parseInt(document.getElementById('setting-maxWorks').value, 10);
      var maxDocSize = parseInt(document.getElementById('setting-maxDocSize').value, 10);
      var maxVideoSize = parseInt(document.getElementById('setting-maxVideoSize').value, 10);

      if (isNaN(maxWorks) || maxWorks < 0) { alert('學生上傳上限需為 0 或正整數'); return; }
      if (isNaN(maxDocSize) || maxDocSize < 1) { alert('證明文件大小需為正整數'); return; }
      if (isNaN(maxVideoSize) || maxVideoSize < 1) { alert('影音檔案大小需為正整數'); return; }

      showLoading('儲存設定中...');
      callApi('updateSettings', {
        settings: {
          maxWorksPerStudent: maxWorks,
          maxDocSize: maxDocSize,
          maxVideoSize: maxVideoSize
        }
      }, function() {
        hideLoading();
        showToast('設定已儲存', 'success');
        // 清除快取
        try { sessionStorage.removeItem('sslp_settings'); } catch(e) {}
        try { sessionStorage.removeItem('sslp_adminData'); } catch(e) {}
      }, function(err) {
        hideLoading();
        alert('儲存失敗: ' + err);
      });
    }

    function populateBulkCategories(cats) {
      var select = document.getElementById('bulk-add-category');
      select.innerHTML = '<option value="">-- 選擇 --</option>';
      cats.forEach(function(cat) {
        var opt = document.createElement('option');
        opt.value = cat.name;
        opt.textContent = cat.name;
        select.appendChild(opt);
      });
    }

    function addBulkItem() {
      var fileInput = document.getElementById('bulk-add-file');
      var category = document.getElementById('bulk-add-category').value;
      var title = document.getElementById('bulk-add-title').value.trim();
      var desc = document.getElementById('bulk-add-desc').value.trim();

      if (!fileInput.files || !fileInput.files[0]) { alert('請選擇檔案'); return; }
      if (!category) { alert('請選擇類別'); return; }
      if (!title) { alert('請輸入標題'); return; }

      var file = fileInput.files[0];
      if (file.size > 50 * 1024 * 1024) { alert('檔案大小超過 50MB 限制'); return; }

      bulkQueue.push({ file: file, category: category, title: title, desc: desc });
      renderBulkQueue();

      // 清空表單以便新增下一筆
      fileInput.value = '';
      document.getElementById('bulk-add-title').value = '';
      document.getElementById('bulk-add-desc').value = '';
      // 類別保持不變，方便連續新增同類別作品

      // 更新收折區高度
      var body = document.getElementById('batch-upload-body');
      if (!body.classList.contains('collapsed')) body.style.maxHeight = body.scrollHeight + 200 + 'px';
    }

    function renderBulkQueue() {
      var area = document.getElementById('bulk-queue-area');
      var list = document.getElementById('bulk-queue-list');
      document.getElementById('bulk-queue-count').textContent = bulkQueue.length;

      if (bulkQueue.length === 0) {
        area.style.display = 'none';
        return;
      }
      area.style.display = '';

      list.innerHTML = '';
      bulkQueue.forEach(function(item, idx) {
        var icon = item.file.type === 'application/pdf' ? 'fa-file-pdf text-red-500' : 'fa-video text-purple-500';
        var size = item.file.size < 1024*1024 ? (item.file.size/1024).toFixed(1) + ' KB' : (item.file.size/(1024*1024)).toFixed(1) + ' MB';
        list.innerHTML +=
          '<div style="background:white; border:1px solid #e2e8f0; border-radius:10px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between;">' +
            '<div style="flex:1; min-width:0;">' +
              '<div class="flex items-center gap-2 mb-1">' +
                '<i class="fas ' + icon + '"></i>' +
                '<span class="font-medium text-gray-800 text-sm" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(item.title) + '</span>' +
                '<span class="text-xs text-gray-400">(' + size + ')</span>' +
              '</div>' +
              '<div class="text-xs text-gray-500">' +
                '<span class="text-blue-500"><i class="fas fa-tag mr-1"></i>' + escapeHtml(item.category) + '</span>' +
                (item.desc ? '<span class="ml-2">' + escapeHtml(truncate(item.desc, 30)) + '</span>' : '') +
              '</div>' +
            '</div>' +
            '<button onclick="removeBulkItem(' + idx + ')" class="text-gray-400 hover:text-red-500 ml-3" style="background:none; border:none; cursor:pointer;" title="移除">' +
              '<i class="fas fa-times-circle"></i>' +
            '</button>' +
          '</div>';
      });
    }

    function removeBulkItem(idx) {
      bulkQueue.splice(idx, 1);
      renderBulkQueue();
    }

    function clearBulkQueue() {
      if (bulkQueue.length > 0 && !confirm('確定要清空待上傳清單嗎？')) return;
      bulkQueue = [];
      renderBulkQueue();
    }

    function startBulkUpload() {
      if (bulkQueue.length === 0) { alert('清單是空的，請先新增作品'); return; }
      if (!confirm('確定要上傳清單中的 ' + bulkQueue.length + ' 筆作品嗎？')) return;

      document.getElementById('bulk-progress').style.display = '';
      document.getElementById('bulk-upload-btn').disabled = true;
      document.getElementById('bulk-upload-btn').innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;"></div> 上傳中...';

      var total = bulkQueue.length;
      var done = 0;
      var errors = [];
      var log = document.getElementById('bulk-log');
      log.innerHTML = '';

      function uploadNext(index) {
        if (index >= total) {
          document.getElementById('bulk-status').textContent = '上傳完成！';
          document.getElementById('bulk-fill').style.width = '100%';
          document.getElementById('bulk-upload-btn').disabled = false;
          document.getElementById('bulk-upload-btn').innerHTML = '<i class="fas fa-upload"></i> 一鍵全部上傳';

          var msg = '批次上傳完成！\n成功：' + done + ' / ' + total;
          if (errors.length > 0) msg += '\n失敗：' + errors.join('、');
          alert(msg);

          bulkQueue = [];
          renderBulkQueue();
          document.getElementById('bulk-progress').style.display = 'none';
          loadStatistics();
          return;
        }

        var item = bulkQueue[index];
        var fileType = item.file.type === 'application/pdf' ? 'pdf' : 'video';

        document.getElementById('bulk-status').textContent = '上傳中：' + item.title;
        document.getElementById('bulk-count').textContent = (index + 1) + ' / ' + total;
        document.getElementById('bulk-fill').style.width = ((index / total) * 100) + '%';

        fileToBase64(item.file, function(base64) {
          callApi('uploadFile', {
            base64: base64,
            fileName: item.file.name,
            mimeType: item.file.type
          }, function(fileResult) {
            callApi('createWork', {
              title: item.title,
              studentName: '管理員',
              description: item.desc,
              fileType: fileType,
              driveFileId: fileResult.fileId,
              category: item.category
            }, function() {
              done++;
              log.innerHTML += '<div class="text-green-600">✓ ' + escapeHtml(item.title) + '</div>';
              log.scrollTop = log.scrollHeight;
              uploadNext(index + 1);
            }, function(err) {
              errors.push(item.title);
              log.innerHTML += '<div class="text-red-500">✗ ' + escapeHtml(item.title) + '：' + err + '</div>';
              log.scrollTop = log.scrollHeight;
              uploadNext(index + 1);
            });
          }, function(err) {
            errors.push(item.title);
            log.innerHTML += '<div class="text-red-500">✗ ' + escapeHtml(item.title) + '：檔案上傳失敗</div>';
            log.scrollTop = log.scrollHeight;
            uploadNext(index + 1);
          });
        });
      }

      uploadNext(0);
    }

    // ============================
    // 收折功能
    // ============================
    function toggleCollapse(bodyId, arrowId) {
      var body = document.getElementById(bodyId);
      var arrow = document.getElementById(arrowId);
      if (body.classList.contains('collapsed')) {
        body.classList.remove('collapsed');
        body.style.maxHeight = body.scrollHeight + 'px';
        arrow.style.transform = 'rotate(180deg)';
      } else {
        body.style.maxHeight = '0';
        body.classList.add('collapsed');
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    // ============================
    // 搜尋功能
    // ============================
    var searchTimer = null;

    function handleAdminSearch(event) {
      clearTimeout(searchTimer);
      if (event.key === 'Enter') { doAdminSearch(); return; }
      searchTimer = setTimeout(function() { doAdminSearch(); }, 500);
    }

    function doAdminSearch() {
      var query = document.getElementById('admin-search').value.trim().toLowerCase();
      if (!query) {
        document.getElementById('search-result-area').style.display = 'none';
        document.getElementById('search-empty').style.display = 'none';
        return;
      }

      showLoading('搜尋中...');
      callApi('searchWorks', { query: query }, function(works) {
        hideLoading();
        searchSelectedIds = {};
        updateSearchSelectedCount();
        document.getElementById('search-select-all').checked = false;

        if (works.length === 0) {
          document.getElementById('search-result-area').style.display = 'none';
          document.getElementById('search-empty').style.display = '';
          return;
        }

        document.getElementById('search-empty').style.display = 'none';
        document.getElementById('search-result-area').style.display = '';
        document.getElementById('search-result-count').textContent = works.length;

        var tbody = document.getElementById('search-table-body');
        tbody.innerHTML = '';
        works.forEach(function(work) {
          tbody.innerHTML += '' +
            '<tr>' +
              '<td><input type="checkbox" value="' + work.id + '" onchange="toggleSearchSelect(\'' + work.id + '\', this.checked)"></td>' +
              '<td>' + escapeHtml(work.studentId) + '</td>' +
              '<td>' + escapeHtml(work.studentName || '-') + '</td>' +
              '<td class="text-xs">' + escapeHtml(work.className || '-') + '</td>' +
              '<td><a href="' + getBaseUrl() + '?page=viewer&id=' + work.id + '" target="_blank" style="color:#2d5f8a;">' + escapeHtml(truncate(work.title, 30)) + '</a></td>' +
              '<td class="text-xs">' + escapeHtml(work.category || '-') + '</td>' +
              '<td>' + getFileTypeBadge(work.fileType) + '</td>' +
              '<td class="text-gray-500 text-sm">' + formatDate(work.createdAt) + '</td>' +
            '</tr>';
        });
      }, function(err) {
        hideLoading();
        alert('搜尋失敗: ' + err);
      });
    }

    function clearAdminSearch() {
      document.getElementById('admin-search').value = '';
      document.getElementById('search-result-area').style.display = 'none';
      document.getElementById('search-empty').style.display = 'none';
      searchSelectedIds = {};
    }

    function toggleSearchSelect(id, checked) {
      if (checked) { searchSelectedIds[id] = true; } else { delete searchSelectedIds[id]; }
      updateSearchSelectedCount();
    }

    function toggleSearchSelectAll(checked) {
      document.querySelectorAll('#search-table-body input[type="checkbox"]').forEach(function(cb) {
        cb.checked = checked;
        toggleSearchSelect(cb.value, checked);
      });
    }

    function updateSearchSelectedCount() {
      var count = Object.keys(searchSelectedIds).length;
      document.getElementById('search-selected-count').textContent = count;
      document.getElementById('search-delete-btn').style.display = count > 0 ? '' : 'none';
    }

    function deleteSearchSelected() {
      var ids = Object.keys(searchSelectedIds);
      if (ids.length === 0) return;
      if (!confirm('確定要刪除所選的 ' + ids.length + ' 件作品嗎？\n此操作無法復原。')) return;

      showLoading('刪除中...');
      callApi('batchDelete', { workIds: ids }, function(result) {
        hideLoading();
        alert('成功刪除 ' + result.deletedCount + ' 件作品');
        searchSelectedIds = {};
        doAdminSearch(); // 重新搜尋
        loadStatistics();
      }, function(err) {
        hideLoading();
        alert('刪除失敗: ' + err);
      });
    }

    // ============================
    // 類別管理
    // ============================
    var categoriesList = [];

    function loadCategories() {
      callApi('getCategories', {}, function(cats) {
        categoriesList = cats;
        renderCategories(cats);
      });
    }

    function renderCategories(cats) {
      var container = document.getElementById('categories-list');
      if (cats.length === 0) { container.innerHTML = '<div class="text-center py-4 text-gray-400">尚無類別，請新增</div>'; return; }
      container.innerHTML = '';
      cats.forEach(function(cat) {
        container.innerHTML +=
          '<div class="cat-item">' +
            '<div class="flex items-center gap-2"><i class="fas fa-tag text-blue-400"></i><span class="font-medium text-gray-800">' + escapeHtml(cat.name) + '</span></div>' +
            '<div class="flex gap-2">' +
              '<button class="text-gray-400 hover:text-blue-500 p-1" onclick="editCategory(\'' + cat.id + '\', \'' + escapeHtml(cat.name).replace(/'/g, "\\'") + '\')" title="編輯"><i class="fas fa-pen text-sm"></i></button>' +
              '<button class="text-gray-400 hover:text-red-500 p-1" onclick="deleteCategoryPrompt(\'' + cat.id + '\', \'' + escapeHtml(cat.name).replace(/'/g, "\\'") + '\')" title="刪除"><i class="fas fa-trash text-sm"></i></button>' +
            '</div>' +
          '</div>';
      });
      // 更新收折區高度
      var body = document.getElementById('cat-body');
      if (!body.classList.contains('collapsed')) { body.style.maxHeight = body.scrollHeight + 'px'; }
    }

    function showAddCategory() {
      document.getElementById('add-cat-form').style.display = '';
      document.getElementById('new-cat-name').value = '';
      document.getElementById('new-cat-name').focus();
      var body = document.getElementById('cat-body');
      if (!body.classList.contains('collapsed')) { body.style.maxHeight = body.scrollHeight + 100 + 'px'; }
    }

    function doAddCategory() {
      var name = document.getElementById('new-cat-name').value.trim();
      if (!name) { alert('請輸入類別名稱'); return; }
      showLoading('新增類別中...');
      callApi('addCategory', { name: name }, function() {
        hideLoading(); document.getElementById('add-cat-form').style.display = 'none';
        showToast('類別已新增', 'success'); loadCategories();
      }, function(err) { hideLoading(); alert('新增失敗: ' + err); });
    }

    function editCategory(catId, oldName) {
      var newName = prompt('修改類別名稱：', oldName);
      if (!newName || newName.trim() === '' || newName.trim() === oldName) return;
      showLoading('修改類別中...');
      callApi('updateCategory', { categoryId: catId, newName: newName.trim() }, function() {
        hideLoading(); showToast('類別已修改，所有對應作品已同步更新', 'success'); loadCategories();
      }, function(err) { hideLoading(); alert('修改失敗: ' + err); });
    }

    function deleteCategoryPrompt(catId, catName) {
      if (categoriesList.length <= 1) { alert('至少需要保留一個類別'); return; }
      var options = [];
      categoriesList.forEach(function(c) { if (c.id !== catId) options.push(c.name); });
      var replacement = prompt('刪除類別「' + catName + '」\n\n該類別下的作品將移到哪個類別？\n可選擇：' + options.join('、') + '\n\n請輸入替代類別名稱：', options[0]);
      if (!replacement) return;
      if (options.indexOf(replacement) === -1) { alert('請輸入正確的替代類別名稱'); return; }
      if (!confirm('確定要刪除類別「' + catName + '」？\n該類別的作品將移到「' + replacement + '」')) return;
      showLoading('刪除類別中...');
      callApi('deleteCategory', { categoryId: catId, replacementName: replacement }, function() {
        hideLoading(); showToast('類別已刪除，作品已移至「' + replacement + '」', 'success'); loadCategories();
      }, function(err) { hideLoading(); alert('刪除失敗: ' + err); });
    }

    // ============================
    // 統計 & 年份
    // ============================
    function loadStatistics() {
      callApi('getStatistics', {}, function(stats) {
        document.getElementById('stat-total').textContent = stats.totalWorks;
        document.getElementById('stat-students').textContent = stats.totalStudents;
        document.getElementById('stat-pdf').textContent = stats.typeStats.pdf;
        document.getElementById('stat-video').textContent = stats.typeStats.video;
        renderYearStats(stats.yearStats);

        var select = document.getElementById('year-select');
        select.innerHTML = '<option value="">-- 選擇入學年份 --</option>';
        stats.yearStats.forEach(function(stat) {
          var opt = document.createElement('option');
          opt.value = stat.year;
          opt.textContent = stat.label + (stat.year > 0 ? (stat.isGraduated ? ' (已畢業)' : ' (在學中)') : '') + ' - ' + stat.workCount + ' 件作品';
          select.appendChild(opt);
        });
      });
    }

    function renderYearStats(yearStats) {
      var container = document.getElementById('year-stats');
      if (yearStats.length === 0) { container.innerHTML = '<div class="text-center py-8 text-gray-400">尚無資料</div>'; return; }
      container.innerHTML = '';
      yearStats.forEach(function(stat) {
        var statusClass = stat.isGraduated ? 'graduated' : 'current';
        var statusText = stat.year === 0
          ? '<span class="text-gray-400 text-sm font-medium"><i class="fas fa-question-circle mr-1"></i>未分類</span>'
          : stat.isGraduated
            ? '<span class="text-red-500 text-sm font-medium"><i class="fas fa-graduation-cap mr-1"></i>已畢業</span>'
            : '<span class="text-green-500 text-sm font-medium"><i class="fas fa-book-reader mr-1"></i>在學中</span>';

        container.innerHTML +=
          '<div class="year-row ' + statusClass + '">' +
            '<div><span class="font-bold text-gray-800">' + escapeHtml(stat.label) + '</span><div class="mt-1">' + statusText + '</div></div>' +
            '<div class="flex items-center gap-6 text-sm">' +
              '<div class="text-center"><div class="font-bold text-gray-800 text-lg">' + stat.studentCount + '</div><div class="text-gray-400">位學生</div></div>' +
              '<div class="text-center"><div class="font-bold text-gray-800 text-lg">' + stat.workCount + '</div><div class="text-gray-400">件作品</div></div>' +
              '<button class="btn-secondary text-xs" onclick="selectYear(' + stat.year + ')"><i class="fas fa-eye mr-1"></i> 查看</button>' +
            '</div>' +
          '</div>';
      });
    }

    function selectYear(year) {
      document.getElementById('year-select').value = year;
      loadYearWorks();
      document.getElementById('year-select').scrollIntoView({ behavior: 'smooth' });
    }

    function loadYearWorks() {
      var rawValue = document.getElementById('year-select').value;
      selectedIds = {};
      updateSelectedCount();
      if (rawValue === '') {
        document.getElementById('batch-table-container').style.display = 'none';
        document.getElementById('batch-empty').style.display = 'none';
        document.getElementById('batch-hint').style.display = '';
        return;
      }
      var year = parseInt(rawValue);
      document.getElementById('batch-hint').style.display = 'none';
      showLoading('載入作品列表...');
      callApi('getWorksByYear', { year: year }, function(works) {
        hideLoading();
        if (works.length === 0) {
          document.getElementById('batch-table-container').style.display = 'none';
          document.getElementById('batch-empty').style.display = '';
          return;
        }
        document.getElementById('batch-empty').style.display = 'none';
        document.getElementById('batch-table-container').style.display = '';
        document.getElementById('select-all').checked = false;
        var tbody = document.getElementById('batch-table-body');
        tbody.innerHTML = '';
        works.forEach(function(work) {
          tbody.innerHTML +=
            '<tr>' +
              '<td><input type="checkbox" value="' + work.id + '" onchange="toggleSelect(\'' + work.id + '\', this.checked)"></td>' +
              '<td>' + escapeHtml(work.studentId) + '</td>' +
              '<td>' + escapeHtml(work.studentName || '-') + '</td>' +
              '<td class="text-xs">' + escapeHtml(work.className || '-') + '</td>' +
              '<td><a href="' + getBaseUrl() + '?page=viewer&id=' + work.id + '" target="_blank" style="color:#2d5f8a;">' + escapeHtml(truncate(work.title, 30)) + '</a></td>' +
              '<td class="text-xs">' + escapeHtml(work.category || '-') + '</td>' +
              '<td>' + getFileTypeBadge(work.fileType) + '</td>' +
              '<td class="text-gray-500 text-sm">' + formatDate(work.createdAt) + '</td>' +
            '</tr>';
        });
      }, function(err) { hideLoading(); showToast('載入失敗: ' + err, 'error'); });
    }

    function toggleSelect(id, checked) { if (checked) selectedIds[id] = true; else delete selectedIds[id]; updateSelectedCount(); }
    function toggleSelectAll(checked) { document.querySelectorAll('#batch-table-body input[type="checkbox"]').forEach(function(cb) { cb.checked = checked; toggleSelect(cb.value, checked); }); }
    function updateSelectedCount() {
      var count = Object.keys(selectedIds).length;
      document.getElementById('selected-count').textContent = count;
      document.getElementById('batch-delete-btn').style.display = count > 0 ? '' : 'none';
    }

    function batchDelete() {
      var ids = Object.keys(selectedIds);
      if (ids.length === 0) { alert('請先勾選要刪除的作品'); return; }
      if (!confirm('確定要刪除所選的 ' + ids.length + ' 件作品嗎？\n此操作無法復原。')) return;
      showLoading('批次刪除中...');
      callApi('batchDelete', { workIds: ids }, function(result) {
        hideLoading(); alert('成功刪除 ' + result.deletedCount + ' 件作品');
        selectedIds = {}; updateSelectedCount(); loadYearWorks(); loadStatistics();
      }, function(err) { hideLoading(); alert('批次刪除失敗: ' + err); });
    }
  </script>
</body>
</html>
