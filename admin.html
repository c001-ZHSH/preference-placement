  <style>
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);

      padding: 12px 16px;

    .batch-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
    }

    .batch-table tr:hover td {
      background: #f7fafc;
    }

    .batch-table input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2d5f8a;
    }
  </style>
</head>
<body>
  <?!= include('components') ?>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- 標題 -->
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-1">
        <i class="fas fa-cog mr-2 text-blue-500"></i>管理員後台
      </h1>
      <p class="text-gray-500">管理平台作品、查看統計資料、批次刪除畢業生檔案</p>
    </div>

    <!-- 統計卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="stats-cards">

      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-students">-</div>
        <p class="text-sm text-gray-500 mt-1">學生人數</p>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-pdf">-</div>

      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-video">-</div>
        <p class="text-sm text-gray-500 mt-1">影片檔案</p>
      </div>
    </div>

    <!-- 各年份統計 -->
    <div class="mb-8">
      <h2 class="text-lg font-bold text-gray-800 mb-4">
        <i class="fas fa-chart-bar mr-1 text-gray-400"></i> 各入學年份統計
      </h2>
      <div id="year-stats" class="flex flex-col gap-3">
        <div class="text-center py-8 text-gray-400">
          <div class="spinner mb-3" style="margin:0 auto;"></div>
          載入中...
        </div>
      </div>
    </div>

    <!-- 類別管理 -->
    <div style="background:white; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.08);" class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-800">
          <i class="fas fa-tags mr-1 text-blue-400"></i> 成果類別管理
        </h2>
        <button class="btn-primary" onclick="showAddCategory()" style="padding:8px 16px; font-size:0.85rem;">

    <!-- 批次刪除區 -->
    <div style="background:white; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.08);">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-800">
          <i class="fas fa-trash-alt mr-1 text-red-400"></i> 批次管理
        </h2>
        <div class="flex items-center gap-3">
          <select id="year-select" class="form-input" style="width:auto; padding:8px 12px;"

            <option value="">-- 選擇入學年份 --</option>

      </div>

  <?!= include('app.js') ?>

  <script>
    var yearWorksMap = {};
    var selectedIds = {};

    function onUserLoaded(user) {
      if (!user.isAdmin) {
        showToast('您沒有管理員權限', 'error');
        return;
      }
      loadStatistics();
      loadCategories();
    }

    // ============================
    // 類別管理
    // ============================
    var categoriesList = [];

    function loadCategories() {
      callApi('getCategories', {}, function(cats) {
        categoriesList = cats;
        renderCategories(cats);
      });
    }

    function renderCategories(cats) {
      var container = document.getElementById('categories-list');
      if (cats.length === 0) {
        container.innerHTML = '<div class="text-center py-4 text-gray-400">尚無類別，請新增</div>';
        return;
      }
      container.innerHTML = '';
      cats.forEach(function(cat) {
        container.innerHTML += '' +
          '<div class="cat-item" id="cat-' + cat.id + '">' +
            '<div class="flex items-center gap-2">' +
              '<i class="fas fa-tag text-blue-400"></i>' +
              '<span class="font-medium text-gray-800" id="cat-name-' + cat.id + '">' + escapeHtml(cat.name) + '</span>' +
            '</div>' +
            '<div class="flex gap-2">' +
              '<button class="text-gray-400 hover:text-blue-500 p-1" onclick="editCategory(\'' + cat.id + '\', \'' + escapeHtml(cat.name).replace(/'/g, "\\'") + '\')" title="編輯名稱">' +
                '<i class="fas fa-pen text-sm"></i>' +
              '</button>' +
              '<button class="text-gray-400 hover:text-red-500 p-1" onclick="deleteCategoryPrompt(\'' + cat.id + '\', \'' + escapeHtml(cat.name).replace(/'/g, "\\'") + '\')" title="刪除類別">' +
                '<i class="fas fa-trash text-sm"></i>' +
              '</button>' +
            '</div>' +
          '</div>';
      });
    }

    function showAddCategory() {
      document.getElementById('add-cat-form').style.display = '';
      document.getElementById('new-cat-name').value = '';
      document.getElementById('new-cat-name').focus();
    }

    function doAddCategory() {
      var name = document.getElementById('new-cat-name').value.trim();
      if (!name) { alert('請輸入類別名稱'); return; }
      showLoading('新增類別中...');
      callApi('addCategory', { name: name }, function() {
        hideLoading();
        document.getElementById('add-cat-form').style.display = 'none';
        showToast('類別已新增', 'success');
        loadCategories();
      }, function(err) {
        hideLoading();
        alert('新增失敗: ' + err);
      });
    }

    function editCategory(catId, oldName) {
      var newName = prompt('修改類別名稱：', oldName);
      if (!newName || newName.trim() === '' || newName.trim() === oldName) return;
      showLoading('修改類別中...');
      callApi('updateCategory', { categoryId: catId, newName: newName.trim() }, function() {
        hideLoading();
        showToast('類別已修改，所有對應作品已同步更新', 'success');
        loadCategories();
      }, function(err) {
        hideLoading();
        alert('修改失敗: ' + err);
      });
    }

    function deleteCategoryPrompt(catId, catName) {
      if (categoriesList.length <= 1) {
        alert('至少需要保留一個類別');
        return;
      }
      // 讓管理者選擇替代類別
      var options = [];
      categoriesList.forEach(function(c) {
        if (c.id !== catId) options.push(c.name);
      });
      var replacement = prompt(
        '刪除類別「' + catName + '」\n\n' +
        '該類別下的作品將移到哪個類別？\n' +
        '可選擇：' + options.join('、') + '\n\n' +
        '請輸入替代類別名稱：',
        options[0]
      );
      if (!replacement) return;
      if (options.indexOf(replacement) === -1) {
        alert('請輸入正確的替代類別名稱');
        return;
      }
      if (!confirm('確定要刪除類別「' + catName + '」？\n該類別的作品將移到「' + replacement + '」')) return;

      showLoading('刪除類別中...');
      callApi('deleteCategory', { categoryId: catId, replacementName: replacement }, function() {
        hideLoading();
        showToast('類別已刪除，作品已移至「' + replacement + '」', 'success');
        loadCategories();
      }, function(err) {
        hideLoading();
        alert('刪除失敗: ' + err);
      });
    }

    function loadStatistics() {
      callApi('getStatistics', {}, function(stats) {
        // 統計卡片
        document.getElementById('stat-total').textContent = stats.totalWorks;
        document.getElementById('stat-students').textContent = stats.totalStudents;
        document.getElementById('stat-pdf').textContent = stats.typeStats.pdf;
        document.getElementById('stat-video').textContent = stats.typeStats.video;

        // 年份統計
        renderYearStats(stats.yearStats);

        // 填入年份下拉選單
        var select = document.getElementById('year-select');
        stats.yearStats.forEach(function(stat) {
          var opt = document.createElement('option');
          opt.value = stat.year;
          opt.textContent = stat.label +
            (stat.year > 0 ? (stat.isGraduated ? ' (已畢業)' : ' (在學中)') : '') +
            ' - ' + stat.workCount + ' 件作品';
          select.appendChild(opt);
        });
      });
    }

    function renderYearStats(yearStats) {
      var container = document.getElementById('year-stats');
      if (yearStats.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-gray-400">尚無資料</div>';
        return;
      }

      container.innerHTML = '';
      yearStats.forEach(function(stat) {
        var statusClass = stat.isGraduated ? 'graduated' : 'current';
        var statusText = '';
        if (stat.year === 0) {
          statusText = '<span class="text-gray-400 text-sm font-medium"><i class="fas fa-question-circle mr-1"></i>未分類</span>';
        } else if (stat.isGraduated) {
          statusText = '<span class="text-red-500 text-sm font-medium"><i class="fas fa-graduation-cap mr-1"></i>已畢業</span>';
        } else {
          statusText = '<span class="text-green-500 text-sm font-medium"><i class="fas fa-book-reader mr-1"></i>在學中</span>';
        }

        container.innerHTML += '' +
          '<div class="year-row ' + statusClass + '">' +
            '<div class="flex items-center gap-4">' +
              '<div>' +
                '<span class="font-bold text-gray-800">' + escapeHtml(stat.label) + '</span>' +
                '<div class="mt-1">' + statusText + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-6 text-sm">' +
              '<div class="text-center">' +
                '<div class="font-bold text-gray-800 text-lg">' + stat.studentCount + '</div>' +
                '<div class="text-gray-400">位學生</div>' +
              '</div>' +
              '<div class="text-center">' +
                '<div class="font-bold text-gray-800 text-lg">' + stat.workCount + '</div>' +
                '<div class="text-gray-400">件作品</div>' +
              '</div>' +
              '<button class="btn-secondary text-xs" onclick="selectYear(' + stat.year + ')">' +
                '<i class="fas fa-eye mr-1"></i> 查看' +
              '</button>' +
            '</div>' +
          '</div>';
      });
    }

    function selectYear(year) {
      document.getElementById('year-select').value = year;
      loadYearWorks();
      // 捲動到批次管理區
      document.getElementById('year-select').scrollIntoView({ behavior: 'smooth' });
    }

    function loadYearWorks() {
      var rawValue = document.getElementById('year-select').value;
      selectedIds = {};
      updateSelectedCount();

      if (rawValue === '') {
        document.getElementById('batch-table-container').style.display = 'none';
        document.getElementById('batch-empty').style.display = 'none';
        document.getElementById('batch-hint').style.display = '';
        return;
      }

      var year = parseInt(rawValue);

      document.getElementById('batch-hint').style.display = 'none';
      showLoading('載入作品列表...');

      callApi('getWorksByYear', { year: year }, function(works) {
        hideLoading();
        yearWorksMap[year] = works;

        if (works.length === 0) {
          document.getElementById('batch-table-container').style.display = 'none';
          document.getElementById('batch-empty').style.display = '';
          return;
        }

        document.getElementById('batch-empty').style.display = 'none';
        document.getElementById('batch-table-container').style.display = '';
        document.getElementById('select-all').checked = false;

        var tbody = document.getElementById('batch-table-body');
        tbody.innerHTML = '';

        works.forEach(function(work) {
          tbody.innerHTML += '' +
            '<tr>' +
              '<td><input type="checkbox" value="' + work.id + '" onchange="toggleSelect(\'' + work.id + '\', this.checked)"></td>' +
              '<td>' + escapeHtml(work.studentId) + '</td>' +
              '<td>' + escapeHtml(work.studentName || '-') + '</td>' +
              '<td><a href="' + getBaseUrl() + '?page=viewer&id=' + work.id + '" target="_blank" style="color:#2d5f8a;">' + escapeHtml(truncate(work.title, 30)) + '</a></td>' +
              '<td>' + getFileTypeBadge(work.fileType) + '</td>' +
              '<td class="text-gray-500 text-sm">' + formatDate(work.createdAt) + '</td>' +
            '</tr>';
        });
      }, function(err) {
        hideLoading();
        showToast('載入失敗: ' + err, 'error');
      });
    }

    function toggleSelect(id, checked) {
      if (checked) {
        selectedIds[id] = true;
      } else {
        delete selectedIds[id];
      }
      updateSelectedCount();
    }

    function toggleSelectAll(checked) {
      var checkboxes = document.querySelectorAll('#batch-table-body input[type="checkbox"]');
      checkboxes.forEach(function(cb) {
        cb.checked = checked;
        toggleSelect(cb.value, checked);
      });
    }

    function updateSelectedCount() {
      var count = Object.keys(selectedIds).length;
      document.getElementById('selected-count').textContent = count;
      document.getElementById('batch-delete-btn').style.display = count > 0 ? '' : 'none';
    }

    function batchDelete() {
      var ids = Object.keys(selectedIds);
      if (ids.length === 0) {
        alert('請先勾選要刪除的作品');
        return;
      }

      if (!confirm('確定要刪除所選的 ' + ids.length + ' 件作品嗎？\n此操作會同時刪除 Google Drive 上的檔案，且無法復原。')) {
        return;
      }

      showLoading('批次刪除中... 請稍候');
      callApi('batchDelete', { workIds: ids }, function(result) {
        hideLoading();
        alert('成功刪除 ' + result.deletedCount + ' 件作品');

        if (result.errors && result.errors.length > 0) {
          alert('部分檔案刪除失敗:\n' + result.errors.join('\n'));
        }

        // 重新載入
        selectedIds = {};
        updateSelectedCount();
        loadYearWorks();
        loadStatistics();
      }, function(err) {
        hideLoading();
        alert('批次刪除失敗: ' + err);
      });
    }
  </script>
</body>
</html>
