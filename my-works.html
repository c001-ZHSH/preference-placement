<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles') ?>
  <style>
    .my-work-item {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: all 0.2s;
    }

    .my-work-item:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .my-work-thumb {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .my-work-thumb.pdf { background: linear-gradient(135deg, #e53e3e, #c53030); }
    .my-work-thumb.video { background: linear-gradient(135deg, #6366f1, #8b5cf6); }

    .edit-form {
      background: #f7fafc;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      display: none;
    }

    .edit-form.active { display: block; }
  </style>
</head>
<body>
  <?!= include('components') ?>

  <div class="max-w-3xl mx-auto px-4 py-8">
    <!-- 標題 -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-800 mb-1">
          <i class="fas fa-folder-open mr-2 text-blue-500"></i>我的作品
        </h1>
        <p class="text-gray-500">管理你上傳的自主學習成果</p>
      </div>
      <button class="btn-primary" onclick="navigateTo('upload')">
        <i class="fas fa-plus"></i> 新增作品
      </button>
    </div>

    <!-- 作品列表 -->
    <div id="works-list" class="flex flex-col gap-4">
      <!-- 由 JS 動態填入 -->
    </div>

    <!-- 空狀態 -->
    <div id="empty-state" class="empty-state" style="display:none;">
      <i class="fas fa-cloud-upload-alt" style="display:block;"></i>
      <h3 class="text-xl font-bold text-gray-400 mb-2">還沒有上傳任何作品</h3>
      <p class="text-gray-400 mb-4">快來分享你的自主學習成果吧！</p>
      <button class="btn-primary" onclick="navigateTo('upload')">
        <i class="fas fa-cloud-upload-alt"></i> 上傳我的作品
      </button>
    </div>

    <!-- 載入中 -->
    <div id="loading-state" class="text-center py-12">
      <div class="spinner mb-4" style="margin:0 auto;"></div>
      <p class="text-gray-400">載入中...</p>
    </div>
  </div>

  <?!= include('app.js') ?>

  <script>
    var myWorks = [];

    function onUserLoaded(user) {
      loadMyWorks();
    }

    function loadMyWorks() {
      document.getElementById('loading-state').style.display = '';
      document.getElementById('works-list').style.display = 'none';
      document.getElementById('empty-state').style.display = 'none';

      callApi('getMyWorks', {}, function(works) {
        myWorks = works;
        document.getElementById('loading-state').style.display = 'none';

        if (works.length === 0) {
          document.getElementById('empty-state').style.display = '';
          return;
        }

        document.getElementById('works-list').style.display = '';
        renderWorksList(works);
      });
    }

    function renderWorksList(works) {
      var container = document.getElementById('works-list');
      container.innerHTML = '';

      works.forEach(function(work, index) {
        var thumbClass = work.fileType === 'pdf' ? 'pdf' : 'video';
        var thumbIcon = work.fileType === 'pdf' ? 'fa-file-pdf' : 'fa-video';
        var baseUrl = getBaseUrl();

        var html = '' +
          '<div class="my-work-item" id="work-item-' + work.id + '">' +
            '<div class="my-work-thumb ' + thumbClass + '" onclick="window.top.location.href=\'' + baseUrl + '?page=viewer&id=' + work.id + '\'" style="cursor:pointer;">' +
              '<i class="fas ' + thumbIcon + '"></i>' +
            '</div>' +
            '<div class="flex-1">' +
              '<div class="flex items-start justify-between">' +
                '<div class="flex-1 cursor-pointer" onclick="window.top.location.href=\'' + baseUrl + '?page=viewer&id=' + work.id + '\'">' +
                  '<h3 class="font-bold text-gray-800">' + escapeHtml(work.title) + '</h3>' +
                  '<p class="text-sm text-gray-500 mt-1">' + escapeHtml(truncate(work.description, 80)) + '</p>' +
                  '<div class="flex items-center gap-3 mt-2">' +
                    getFileTypeBadge(work.fileType) +
                    '<span class="text-xs text-gray-400">' + formatDate(work.createdAt) + '</span>' +
                  '</div>' +
                '</div>' +
                '<div class="flex gap-2 ml-4 flex-shrink-0">' +
                  '<button class="text-gray-400 hover:text-blue-500 p-1" onclick="toggleEdit(\'' + work.id + '\')" title="編輯">' +
                    '<i class="fas fa-pen"></i>' +
                  '</button>' +
                  '<button class="text-gray-400 hover:text-red-500 p-1" onclick="confirmDelete(\'' + work.id + '\', \'' + escapeHtml(work.title).replace(/'/g, "\\'") + '\')" title="刪除">' +
                    '<i class="fas fa-trash"></i>' +
                  '</button>' +
                '</div>' +
              '</div>' +
              '<!-- 編輯表單 -->' +
              '<div class="edit-form" id="edit-form-' + work.id + '">' +
                '<div class="mb-3">' +
                  '<label class="block text-sm font-medium text-gray-700 mb-1">標題</label>' +
                  '<input type="text" class="form-input" id="edit-title-' + work.id + '" value="' + escapeHtml(work.title) + '">' +
                '</div>' +
                '<div class="mb-3">' +
                  '<label class="block text-sm font-medium text-gray-700 mb-1">說明</label>' +
                  '<textarea class="form-input" rows="3" id="edit-desc-' + work.id + '">' + escapeHtml(work.description) + '</textarea>' +
                '</div>' +
                '<div class="flex gap-2 justify-end">' +
                  '<button class="btn-secondary" onclick="toggleEdit(\'' + work.id + '\')">取消</button>' +
                  '<button class="btn-primary" onclick="saveEdit(\'' + work.id + '\')"><i class="fas fa-save mr-1"></i>儲存</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>';

        container.innerHTML += html;
      });
    }

    function toggleEdit(workId) {
      var form = document.getElementById('edit-form-' + workId);
      form.classList.toggle('active');
    }

    function saveEdit(workId) {
      var title = document.getElementById('edit-title-' + workId).value.trim();
      var description = document.getElementById('edit-desc-' + workId).value.trim();

      if (!title) {
        showToast('標題不能為空', 'error');
        return;
      }

      showLoading('儲存中...');
      callApi('updateWork', {
        id: workId,
        title: title,
        description: description
      }, function() {
        hideLoading();
        showToast('更新成功！', 'success');
        loadMyWorks(); // 重新載入
      }, function(err) {
        hideLoading();
        showToast('更新失敗: ' + err, 'error');
      });
    }

    function confirmDelete(workId, title) {
      showConfirm(
        '確認刪除',
        '確定要刪除作品「' + title + '」嗎？此操作無法復原。',
        function() {
          deleteWorkItem(workId);
        }
      );
    }

    function deleteWorkItem(workId) {
      showLoading('刪除中...');
      callApi('deleteWork', { id: workId }, function() {
        hideLoading();
        showToast('作品已刪除', 'success');
        loadMyWorks();
      }, function(err) {
        hideLoading();
        showToast('刪除失敗: ' + err, 'error');
      });
    }
  </script>
</body>
</html>
