<script>
// ============================================
// app.js.html - 前端共用邏輯
// ============================================

// === 全域狀態 ===
var currentUser = null;
var confirmCallback = null;

// === 初始化 ===
document.addEventListener('DOMContentLoaded', function() {
  loadCurrentUser();
});

/**
 * 載入目前使用者資訊
 */
function loadCurrentUser() {
  callApi('getCurrentUser', {}, function(result) {
    applyUserInfo(result);
  });
}

/**
 * 套用使用者資訊到 UI（可被合併 API 直接呼叫）
 */
function applyUserInfo(user) {
  currentUser = user;
  var displayEl = document.getElementById('user-display-name');
  if (displayEl) {
    displayEl.textContent = user.name || user.studentId;
  }

  if (user.role === 'admin') {
    document.querySelectorAll('.nav-admin').forEach(function(el) { el.style.display = ''; });
  } else {
    document.querySelectorAll('.nav-student').forEach(function(el) { el.style.display = ''; });
  }

  if (typeof onUserLoaded === 'function') {
    onUserLoaded(user);
  }
}

/**
 * 統一 API 呼叫
 */
function callApi(action, params, onSuccess, onError) {
  google.script.run
    .withSuccessHandler(function(response) {
      if (response.success) {
        if (onSuccess) onSuccess(response.data);
      } else {
        var errMsg = response.error || '操作失敗';
        if (onError) {
          onError(errMsg);
        } else {
          showToast(errMsg, 'error');
        }
      }
    })
    .withFailureHandler(function(err) {
      var errMsg = err.message || '系統錯誤';
      if (onError) {
        onError(errMsg);
      } else {
        showToast(errMsg, 'error');
      }
    })
    .handleApiRequest(action, params || {});
}

// === Toast 通知 ===
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.3s';
    setTimeout(function() { toast.remove(); }, 300);
  }, 3000);
}

// === 確認彈窗 ===
function showConfirm(title, message, callback) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').textContent = message;
  document.getElementById('confirm-modal').classList.add('active');
  confirmCallback = callback;
}

function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('active');
  confirmCallback = null;
}

function confirmAction() {
  closeConfirm();
  if (confirmCallback) confirmCallback();
}

// === 載入遮罩 ===
function showLoading(text) {
  document.getElementById('loading-text').textContent = text || '載入中...';
  document.getElementById('loading-overlay').classList.add('active');
}

function hideLoading() {
  document.getElementById('loading-overlay').classList.remove('active');
}

// === 工具函數 ===

/**
 * 格式化日期
 */
function formatDate(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  var year = d.getFullYear() - 1911;
  if (year < 1 || year > 200) return '';
  var month = (d.getMonth() + 1);
  var day = d.getDate();
  return year + '/' + (month < 10 ? '0' : '') + month + '/' + (day < 10 ? '0' : '') + day;
}

/**
 * 格式化檔案大小
 */
function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

/**
 * 檔案類型圖示
 */
function getFileTypeIcon(fileType) {
  if (fileType === 'pdf') return '<i class="fas fa-file-pdf"></i>';
  if (fileType === 'video') return '<i class="fas fa-video"></i>';
  return '<i class="fas fa-file"></i>';
}

/**
 * 檔案類型 badge
 */
function getFileTypeBadge(fileType) {
  if (fileType === 'pdf') {
    return '<span class="badge badge-pdf"><i class="fas fa-file-pdf mr-1"></i>PDF</span>';
  }
  if (fileType === 'video') {
    return '<span class="badge badge-video"><i class="fas fa-video mr-1"></i>影片</span>';
  }
  return '';
}

/**
 * 截斷文字
 */
function truncate(str, maxLen) {
  if (!str && str !== 0) return '';
  str = str.toString();
  if (str.length <= maxLen) return str;
  return str.substring(0, maxLen) + '...';
}

/**
 * 建立作品卡片 HTML
 */
function createWorkCard(work) {
  var thumbClass = work.fileType === 'pdf' ? 'pdf-thumb' : 'video-thumb';
  var thumbIcon = work.fileType === 'pdf' ? 'fa-file-pdf' : 'fa-play-circle';
  var baseUrl = getBaseUrl();

  var likeCount = work.likeCount || 0;
  var likedClass = work.liked ? 'color:#e53e3e;' : '';

  // 縮圖 HTML
  var thumbnailHtml = '';
  var thumbId = 'thumb-' + work.id;

  if (work.driveFileId && work.fileType === 'pdf') {
    // PDF：直接用 Drive 縮圖 URL（通常可用）
    var thumbUrl = 'https://drive.google.com/thumbnail?id=' + work.driveFileId + '&sz=w400';
    thumbnailHtml =
      '<div class="thumbnail ' + thumbClass + '" style="position:relative;">' +
        '<img src="' + thumbUrl + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' +
        '<div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;position:absolute;inset:0;">' +
          '<i class="fas ' + thumbIcon + '"></i>' +
        '</div>' +
      '</div>';
  } else if (work.driveFileId && work.fileType === 'video') {
    // 影片：縮圖 + hover 預覽
    thumbnailHtml =
      '<div class="thumbnail ' + thumbClass + '" id="' + thumbId + '" style="position:relative;" ' +
           'data-file-id="' + work.driveFileId + '" ' +
           'onmouseenter="startVideoPreview(this)" onmouseleave="stopVideoPreview(this)">' +
        '<i class="fas fa-play-circle"></i>' +
      '</div>';
  } else {
    thumbnailHtml =
      '<div class="thumbnail ' + thumbClass + '">' +
        '<i class="fas ' + thumbIcon + '"></i>' +
      '</div>';
  }

  var viewUrl = baseUrl + '?page=viewer&id=' + work.id;

  return '' +
    '<a class="work-card" href="' + viewUrl + '" target="_top" style="text-decoration:none; color:inherit; display:block;">' +
      thumbnailHtml +
      '<div class="p-4">' +
        '<div class="flex items-center justify-between mb-2">' +
          getFileTypeBadge(work.fileType) +
          '<span class="text-xs text-gray-400">' + formatDate(work.createdAt) + '</span>' +
        '</div>' +
        (work.category ? '<div class="text-xs text-blue-500 mb-1"><i class="fas fa-tag mr-1"></i>' + escapeHtml(work.category) + '</div>' : '') +
        '<h3 class="font-bold text-gray-800 mb-1">' + escapeHtml(truncate(work.title, 20)) + '</h3>' +
        '<div class="flex items-center justify-between">' +
          '<div class="flex items-center gap-1 text-xs text-gray-400">' +
            '<i class="fas fa-user"></i>' +
            '<span>' + escapeHtml(work.studentName || work.studentId) + '</span>' +
          '</div>' +
          '<div class="flex items-center gap-1 text-xs" style="' + likedClass + (likedClass ? '' : 'color:#a0aec0;') + '">' +
            '<i class="fas fa-heart"></i>' +
            '<span>' + likeCount + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</a>';
}

/**
 * HTML 跳脫（防 XSS）
 */
function escapeHtml(str) {
  if (!str && str !== 0) return '';
  return ('' + str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/**
 * 取得 Web App 基礎 URL
 */
function getBaseUrl() {
  // 在 Google Apps Script 中，這個值會由模板注入
  return '<?= ScriptApp.getService().getUrl() ?>';
}

/**
 * 導覽到指定頁面
 */
function navigateTo(page, params) {
  var url = getBaseUrl() + '?page=' + page;
  if (params) {
    for (var key in params) {
      url += '&' + key + '=' + encodeURIComponent(params[key]);
    }
  }
  window.top.location.href = url;
}

/**
 * 將檔案轉為 Base64
 */
function fileToBase64(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    // 移除 data:...;base64, 前綴
    var base64 = e.target.result.split(',')[1];
    callback(base64);
  };
  reader.readAsDataURL(file);
}

/**
 * 載入影片縮圖（在卡片渲染後呼叫）
 */
var videoBlobCache = {}; // 快取影片 blob URL

function loadVideoThumbnails(works) {
  works.forEach(function(work) {
    if (work.fileType === 'video' && work.driveFileId) {
      var thumbId = 'thumb-' + work.id;
      // 直接從影片取第一幀作為縮圖
      loadVideoFirstFrame(work.driveFileId, thumbId);
    }
  });
}

/**
 * 從影片取得第一幀作為縮圖
 */
function loadVideoFirstFrame(fileId, thumbId) {
  // 如果已有快取的 blob URL，直接用它取第一幀
  if (videoBlobCache[fileId]) {
    extractFrameFromBlobUrl(videoBlobCache[fileId], thumbId);
    return;
  }

  // 沒有快取，從後端取得影片資料
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || !result.base64) return;
      try {
        var byteChars = atob(result.base64);
        var byteArrays = [];
        for (var offset = 0; offset < byteChars.length; offset += 512) {
          var slice = byteChars.slice(offset, offset + 512);
          var byteNumbers = new Array(slice.length);
          for (var i = 0; i < slice.length; i++) {
            byteNumbers[i] = slice.charCodeAt(i);
          }
          byteArrays.push(new Uint8Array(byteNumbers));
        }
        var blob = new Blob(byteArrays, { type: result.mimeType });
        var blobUrl = URL.createObjectURL(blob);
        videoBlobCache[fileId] = blobUrl;
        extractFrameFromBlobUrl(blobUrl, thumbId);
      } catch (e) { /* ignore */ }
    })
    .withFailureHandler(function() {})
    .getFileBase64(fileId);
}

/**
 * 從 blob URL 擷取影片第一幀作為靜態圖片
 */
function extractFrameFromBlobUrl(blobUrl, thumbId) {
  var video = document.createElement('video');
  video.crossOrigin = 'anonymous';
  video.muted = true;
  video.src = blobUrl;

  video.addEventListener('loadeddata', function() {
    video.currentTime = 0.5; // 取 0.5 秒的畫面
  });

  video.addEventListener('seeked', function() {
    try {
      var canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      var frameUrl = canvas.toDataURL('image/jpeg', 0.7);
      setVideoThumbImage(thumbId, frameUrl);
    } catch (e) { /* ignore */ }
  });

  video.load();
}

function setVideoThumbImage(thumbId, imageUrl) {
  var el = document.getElementById(thumbId);
  if (!el) return;
  el.setAttribute('data-thumb-url', imageUrl);
  el.setAttribute('data-original-html',
    '<img src="' + imageUrl + '" style="width:100%;height:100%;object-fit:cover;">' +
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">' +
      '<i class="fas fa-play-circle" style="font-size:3rem;color:white;opacity:0.85;text-shadow:0 2px 8px rgba(0,0,0,0.5);"></i>' +
    '</div>'
  );
  el.innerHTML = el.getAttribute('data-original-html');
}

/**
 * Hover 影片預覽 - 滑鼠移入時播放 2 秒
 */
var previewTimer = null;
var previewLoadingId = null;

function startVideoPreview(el) {
  var fileId = el.getAttribute('data-file-id');
  if (!fileId) return;

  // 如果已有快取的 blob URL，直接播放
  if (videoBlobCache[fileId]) {
    showVideoInThumb(el, videoBlobCache[fileId]);
    return;
  }

  // 沒有快取，載入影片（顯示載入提示）
  previewLoadingId = fileId;

  // 顯示載入中 spinner
  if (!el.getAttribute('data-original-html')) {
    el.setAttribute('data-original-html', el.innerHTML);
  }
  el.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;flex-direction:column;gap:8px;">' +
      '<div class="spinner" style="width:30px;height:30px;border-width:3px;border-top-color:white;"></div>' +
      '<span style="color:white;font-size:0.75rem;opacity:0.7;">載入預覽...</span>' +
    '</div>';

  // 用 getFileBase64 取得影片資料
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || !result.base64) return;
      if (previewLoadingId !== fileId) return; // 已移出，取消

      try {
        var byteChars = atob(result.base64);
        var byteArrays = [];
        for (var offset = 0; offset < byteChars.length; offset += 512) {
          var slice = byteChars.slice(offset, offset + 512);
          var byteNumbers = new Array(slice.length);
          for (var i = 0; i < slice.length; i++) {
            byteNumbers[i] = slice.charCodeAt(i);
          }
          byteArrays.push(new Uint8Array(byteNumbers));
        }
        var blob = new Blob(byteArrays, { type: result.mimeType });
        var blobUrl = URL.createObjectURL(blob);
        videoBlobCache[fileId] = blobUrl;

        // 確認滑鼠仍在此元素上
        if (el.matches(':hover')) {
          showVideoInThumb(el, blobUrl);
        }
      } catch (e) { /* ignore */ }
    })
    .withFailureHandler(function() { /* ignore */ })
    .getFileBase64(fileId);
}

function showVideoInThumb(el, blobUrl) {
  // 保存原始內容
  if (!el.getAttribute('data-original-html')) {
    el.setAttribute('data-original-html', el.innerHTML);
  }

  el.innerHTML =
    '<video muted autoplay playsinline style="width:100%;height:100%;object-fit:cover;"' +
    ' src="' + blobUrl + '"></video>';

  var video = el.querySelector('video');
  if (video) {
    video.currentTime = 0;
    video.play().catch(function() {});

    // 2 秒後自動暫停並循環
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function() {
      if (video && !video.paused) {
        video.currentTime = 0;
        video.play().catch(function() {});
      }
    }, 2000);
  }
}

function stopVideoPreview(el) {
  previewLoadingId = null;
  clearTimeout(previewTimer);

  var video = el.querySelector('video');
  if (video) {
    video.pause();
  }

  // 恢復原始縮圖
  var original = el.getAttribute('data-original-html');
  if (original) {
    el.innerHTML = original;
  }
}
</script>
