  <style>
    /* PDF 閱讀器 */
    .pdf-viewer {
      background: #2d3748;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .pdf-canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 500px;
      padding: 20px;
      overflow: auto;
    }

    .pdf-canvas-container canvas {
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      max-width: 100%;
    }

    .pdf-controls {
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .pdf-controls button {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .pdf-controls button:hover { background: rgba(255,255,255,0.3); }
    .pdf-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
    .pdf-controls span { color: white; font-size: 0.875rem; }

    /* 作品資訊側邊 */
    .work-info-panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .like-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #e2e8f0;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: #a0aec0;
      transition: all 0.2s;
    }

    .like-btn:hover {
      border-color: #fc8181;
      color: #e53e3e;
    }

    .like-btn.liked {
      border-color: #e53e3e;
      color: #e53e3e;
      background: #fff5f5;
    }

    .like-btn.liked i {
      animation: likePopIn 0.3s ease;
    }

    @keyframes likePopIn {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <?!= include('components') ?>

  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- 返回按鈕 -->
    <div class="mb-4">
      <a href="<?= ScriptApp.getService().getUrl() ?>" class="text-gray-500 hover:text-gray-700" style="text-decoration:none;">
        <i class="fas fa-arrow-left mr-1"></i> 返回首頁

  <script>
    var workId = '<?= workId ?>';
    var pdfDoc = null;
    var pdfPageNum = 1;
    var pdfScale = 1.2;

    function onUserLoaded(user) {
      if (!workId) {
        showNotFound();
        return;
      }
      loadWork();
    }

    function loadWork() {
      callApi('getWorkById', { id: workId }, function(work) {
        if (!work) { showNotFound(); return; }

        document.getElementById('viewer-loading').style.display = 'none';
        document.getElementById('viewer-content').style.display = '';

        // 填入作品資訊
        document.getElementById('work-title').textContent = work.title;
        document.getElementById('work-author').textContent = work.studentName || work.studentId;
        document.getElementById('work-date').textContent = '上傳於 ' + formatDate(work.createdAt);
        document.getElementById('work-type-badge').innerHTML = getFileTypeBadge(work.fileType);

        if (work.category) {
          var catEl = document.getElementById('work-category');
          catEl.style.display = '';
          catEl.querySelector('span').textContent = work.category;
        }

        if (work.description) {
          document.getElementById('work-description').textContent = work.description;
        }

        // 顯示按讚資訊
        updateLikeUI(work.liked, work.likeCount);

        // 根據檔案類型載入
        if (work.fileType === 'pdf') {
          loadPdfViewer(work.driveFileId);
        } else {
          loadVideoPlayer(work.driveFileId);
        }
      }, function(err) {
        showNotFound();
      });
    }

    function showNotFound() {
      document.getElementById('viewer-loading').style.display = 'none';
      document.getElementById('viewer-notfound').style.display = '';
    }

    // ============================
    // 按讚功能
    // ============================
    function toggleLike() {
      callApi('toggleLike', { workId: workId }, function(result) {
        updateLikeUI(result.liked, result.likeCount);
      });
    }

    function updateLikeUI(liked, count) {
      var btn = document.getElementById('like-btn');
      var icon = document.getElementById('like-icon');
      var countEl = document.getElementById('like-count');

      countEl.textContent = count || 0;

      if (liked) {
        btn.classList.add('liked');
        icon.className = 'fas fa-heart';
      } else {
        btn.classList.remove('liked');
        icon.className = 'far fa-heart';
      }
    }

    // ============================
    // PDF 閱讀器
    // ============================
    function loadPdfViewer(fileId) {
      document.getElementById('pdf-viewer').style.display = '';

      // 透過 Apps Script 取得 PDF base64 資料
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result) {
            showToast('無法載入 PDF 檔案', 'error');
            return;
          }
          var pdfData = atob(result.base64);
          var pdfjsLib = window['pdfjs-dist/build/pdf'];
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

          pdfjsLib.getDocument({ data: pdfData }).promise.then(function(doc) {
            pdfDoc = doc;
            document.getElementById('pdf-page-info').textContent = '1 / ' + doc.numPages;
            renderPdfPage(1);
          });
        })
        .withFailureHandler(function(err) {
          showToast('載入 PDF 失敗', 'error');
        })
        .getFileBase64(fileId);
    }

    function renderPdfPage(num) {
      pdfDoc.getPage(num).then(function(page) {
        var viewport = page.getViewport({ scale: pdfScale });
        var canvas = document.getElementById('pdf-canvas');
        var ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
          pdfPageNum = num;
          document.getElementById('pdf-page-info').textContent = num + ' / ' + pdfDoc.numPages;
          document.getElementById('pdf-prev').disabled = num <= 1;
          document.getElementById('pdf-next').disabled = num >= pdfDoc.numPages;
        });
      });
    }

    function pdfPrevPage() {
      if (pdfPageNum > 1) renderPdfPage(pdfPageNum - 1);
    }

    function pdfNextPage() {
      if (pdfDoc && pdfPageNum < pdfDoc.numPages) renderPdfPage(pdfPageNum + 1);
    }

    function pdfZoomIn() {
      pdfScale = Math.min(pdfScale + 0.2, 3.0);
      document.getElementById('pdf-zoom-info').textContent = Math.round(pdfScale * 100) + '%';
      renderPdfPage(pdfPageNum);
    }

    function pdfZoomOut() {
      pdfScale = Math.max(pdfScale - 0.2, 0.4);
      document.getElementById('pdf-zoom-info').textContent = Math.round(pdfScale * 100) + '%';
      renderPdfPage(pdfPageNum);
    }

    function pdfFullscreen() {
      var el = document.getElementById('pdf-viewer');
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }

    // 鍵盤快捷鍵（PDF）
    document.addEventListener('keydown', function(e) {
      if (!pdfDoc) return;
      if (e.key === 'ArrowLeft') pdfPrevPage();
      else if (e.key === 'ArrowRight') pdfNextPage();
      else if (e.key === '+' || e.key === '=') pdfZoomIn();
      else if (e.key === '-') pdfZoomOut();
    });

    // ============================
    // 影片播放器（透過後端取得影片資料）
    // ============================
    function loadVideoPlayer(fileId) {
      document.getElementById('video-player').style.display = '';
      document.getElementById('video-loading').style.display = 'flex';
      document.getElementById('video-element').style.display = 'none';
      document.getElementById('video-error').style.display = 'none';

      // 透過 Apps Script 取得影片的 base64 資料
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result || !result.base64) {
            document.getElementById('video-loading').style.display = 'none';
            document.getElementById('video-error').style.display = '';
            return;
          }

          try {
            // 將 base64 轉為 Blob URL
            var byteChars = atob(result.base64);
            var byteArrays = [];
            // 分段處理避免記憶體爆掉
            for (var offset = 0; offset < byteChars.length; offset += 512) {
              var slice = byteChars.slice(offset, offset + 512);
              var byteNumbers = new Array(slice.length);
              for (var i = 0; i < slice.length; i++) {
                byteNumbers[i] = slice.charCodeAt(i);
              }
              byteArrays.push(new Uint8Array(byteNumbers));
            }
            var blob = new Blob(byteArrays, { type: result.mimeType });
            var blobUrl = URL.createObjectURL(blob);

            var video = document.getElementById('video-element');
            video.src = blobUrl;
            video.style.display = '';
            document.getElementById('video-loading').style.display = 'none';
          } catch (e) {
            document.getElementById('video-loading').style.display = 'none';
            document.getElementById('video-error').style.display = '';
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('video-loading').style.display = 'none';
          document.getElementById('video-error').style.display = '';
        })
        .getFileBase64(fileId);
    }
  </script>
</body>
</html>
