<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles') ?>
  <style>
    .attach-box { border: 2px dashed #e2e8f0; border-radius: 12px; padding: 16px; background: #fafbfc; transition: all 0.2s; }
    .attach-box.filled { border-style: solid; background: #f0fdf4; border-color: #86efac; }
    .attach-box.error { border-color: #fca5a5; background: #fef2f2; }
  </style>
</head>
<body>
  <?!= include('components') ?>

  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-1">
        <i class="fas fa-cloud-upload-alt mr-2 text-blue-500"></i>上傳學習成果
      </h1>
      <p class="text-gray-500">至少需要上傳證明文件或影音檔案其中一種</p>
    </div>

    <!-- 超限提示 -->
    <div id="limit-warning" style="display:none;" class="mb-4 p-4 rounded-12" style="background:#fef2f2; border:1px solid #fca5a5; border-radius:12px;">
      <p class="text-red-600 font-medium"><i class="fas fa-exclamation-triangle mr-1"></i> <span id="limit-msg"></span></p>
    </div>

    <div style="background:white; border-radius:16px; padding:32px; box-shadow:0 2px 12px rgba(0,0,0,0.08);">

      <!-- 步驟 1：成果類別 -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-2">
          <span class="bg-blue-100 text-blue-700 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-1">1</span>
          成果類別 <span class="text-red-500">*</span>
        </label>
        <select id="work-category" class="form-input">
          <option value="">-- 請選擇成果類別 --</option>
        </select>
      </div>

      <!-- 步驟 2：作品標題 -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-2">
          <span class="bg-blue-100 text-blue-700 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-1">2</span>
          作品標題 <span class="text-red-500">*</span>
        </label>
        <input type="text" id="work-title" class="form-input" placeholder="請輸入作品標題（最多20字）" maxlength="20">
      </div>

      <!-- 步驟 3：作品說明 -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-2">
          <span class="bg-blue-100 text-blue-700 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-1">3</span>
          作品說明
        </label>
        <textarea id="work-description" class="form-input" rows="3"
                  placeholder="簡單介紹你的學習成果（最多100字）" maxlength="100"></textarea>
        <p class="text-xs text-gray-400 mt-1 text-right"><span id="desc-count">0</span> / 100</p>
      </div>

      <!-- 步驟 4：附件 -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-3">
          <span class="bg-blue-100 text-blue-700 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-1">4</span>
          附件（至少上傳證明文件或影音檔案其中一種）
        </label>

        <!-- 證明文件 -->
        <div class="attach-box mb-3" id="proof-box">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <i class="fas fa-file-alt text-red-500"></i>
              <span class="font-medium text-sm">證明文件</span>
              <span class="text-xs text-gray-400">PDF / JPG / PNG，最大 <span id="max-doc-size">4</span>MB</span>
            </div>
            <button id="proof-clear" onclick="clearAttach('proof')" style="display:none; background:none; border:none; color:#a0aec0; cursor:pointer;"><i class="fas fa-times-circle"></i></button>
          </div>
          <input type="file" id="proof-file" accept=".pdf,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf" onchange="handleAttachSelect('proof', this)" style="font-size:0.85rem; width:100%;">
          <p id="proof-info" class="text-xs text-green-600 mt-2" style="display:none;"></p>
        </div>

        <!-- 影音檔案 -->
        <div class="attach-box mb-3" id="video-box">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <i class="fas fa-video text-purple-500"></i>
              <span class="font-medium text-sm">影音檔案</span>
              <span class="text-xs text-gray-400">MP3 / MP4，最大 <span id="max-video-size">10</span>MB</span>
            </div>
            <button id="video-clear" onclick="clearAttach('video')" style="display:none; background:none; border:none; color:#a0aec0; cursor:pointer;"><i class="fas fa-times-circle"></i></button>
          </div>
          <input type="file" id="video-file" accept=".mp3,.mp4,audio/mpeg,video/mp4" onchange="handleAttachSelect('video', this)" style="font-size:0.85rem; width:100%;">
          <p id="video-info" class="text-xs text-green-600 mt-2" style="display:none;"></p>
        </div>

        <!-- 外部連結 -->
        <div class="attach-box">
          <div class="flex items-center gap-2 mb-2">
            <i class="fas fa-link text-blue-500"></i>
            <span class="font-medium text-sm">影音外部連結</span>
            <span class="text-xs text-gray-400">（選填）YouTube 或 雲端硬碟</span>
          </div>
          <input type="url" id="external-link" class="form-input" placeholder="https://..." style="padding:8px; font-size:0.9rem;">
        </div>
      </div>

      <!-- 上傳進度 -->
      <div id="upload-progress" style="display:none;" class="mb-6">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium text-gray-700" id="progress-status">上傳中...</span>
          <span class="text-sm text-gray-500" id="progress-percent">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>

      <button class="btn-primary w-full justify-center text-base py-3" id="submit-btn" onclick="submitWork()">
        <i class="fas fa-paper-plane"></i> 上傳作品
      </button>
    </div>
  </div>

  <?!= include('app.js') ?>

  <script>
    var selectedFiles = { proof: null, video: null };
    var settings = { maxDocSize: 4, maxVideoSize: 10, maxWorksPerStudent: 5 };

    function fillCategorySelect(cats) {
      var select = document.getElementById('work-category');
      select.innerHTML = '<option value="">-- 請選擇成果類別 --</option>';
      cats.forEach(function(cat) {
        var opt = document.createElement('option');
        opt.value = cat.name;
        opt.textContent = cat.name;
        select.appendChild(opt);
      });
    }

    function applySettings(s) {
      settings = s;
      document.getElementById('max-doc-size').textContent = s.maxDocSize;
      document.getElementById('max-video-size').textContent = s.maxVideoSize;
    }

    function onUserLoaded(user) {
      // 檢查是否達上傳上限
      if (user.isStudent && user.maxWorks > 0 && user.workCount >= user.maxWorks) {
        document.getElementById('limit-warning').style.display = '';
        document.getElementById('limit-msg').textContent = '您已達上傳上限（' + user.maxWorks + ' 件），請先到「我的作品」刪除舊作品才能繼續上傳。';
        document.getElementById('submit-btn').disabled = true;
      }

      var cachedCats = loadCache('categories', 600000);
      if (cachedCats) fillCategorySelect(cachedCats);
      var cachedSettings = loadCache('settings', 600000);
      if (cachedSettings) applySettings(cachedSettings);

      callApi('getCategories', {}, function(cats) { saveCache('categories', cats); fillCategorySelect(cats); });
      callApi('getSettings', {}, function(s) { saveCache('settings', s); applySettings(s); });
    }

    document.getElementById('work-description').addEventListener('input', function() {
      document.getElementById('desc-count').textContent = this.value.length;
    });

    function handleAttachSelect(type, input) {
      if (!input.files || !input.files[0]) return;
      var file = input.files[0];

      // 檢查類型
      var allowed;
      if (type === 'proof') {
        allowed = ['application/pdf', 'image/jpeg', 'image/png'];
      } else {
        allowed = ['audio/mpeg', 'video/mp4'];
      }
      var ok = allowed.indexOf(file.type) !== -1;
      // Fallback: 檢查副檔名
      if (!ok) {
        var ext = file.name.toLowerCase().split('.').pop();
        var extAllowed = type === 'proof' ? ['pdf','jpg','jpeg','png'] : ['mp3','mp4'];
        ok = extAllowed.indexOf(ext) !== -1;
      }
      if (!ok) {
        alert(type === 'proof' ? '證明文件只能是 PDF / JPG / PNG' : '影音檔案只能是 MP3 / MP4');
        input.value = '';
        return;
      }

      // 檢查大小
      var maxSize = (type === 'proof' ? settings.maxDocSize : settings.maxVideoSize) * 1024 * 1024;
      if (file.size > maxSize) {
        alert('檔案超過 ' + (type === 'proof' ? settings.maxDocSize : settings.maxVideoSize) + 'MB 限制');
        input.value = '';
        return;
      }

      selectedFiles[type] = file;
      var info = document.getElementById(type + '-info');
      info.style.display = '';
      info.innerHTML = '<i class="fas fa-check-circle mr-1"></i> 已選擇：' + escapeHtml(file.name) + ' (' + formatFileSize(file.size) + ')';
      document.getElementById(type + '-clear').style.display = '';
      document.getElementById(type + '-box').classList.add('filled');
    }

    function clearAttach(type) {
      selectedFiles[type] = null;
      document.getElementById(type + '-file').value = '';
      document.getElementById(type + '-info').style.display = 'none';
      document.getElementById(type + '-clear').style.display = 'none';
      document.getElementById(type + '-box').classList.remove('filled');
    }

    function submitWork() {
      var category = document.getElementById('work-category').value;
      var title = document.getElementById('work-title').value.trim();
      var description = document.getElementById('work-description').value.trim();
      var externalLink = document.getElementById('external-link').value.trim();
      var studentName = currentUser ? currentUser.name : '';

      if (!category) { alert('請選擇成果類別'); return; }
      if (!title) { alert('請輸入作品標題'); return; }
      if (!selectedFiles.proof && !selectedFiles.video) {
        alert('請至少上傳證明文件或影音檔案其中一種');
        return;
      }

      document.getElementById('submit-btn').disabled = true;
      document.getElementById('submit-btn').innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;display:inline-block;"></div> 上傳中...';
      document.getElementById('upload-progress').style.display = '';

      // 計算總步驟
      var totalSteps = 0;
      if (selectedFiles.proof) totalSteps++;
      if (selectedFiles.video) totalSteps++;
      totalSteps++; // createWork
      var step = 0;

      var uploaded = { proofFileId: '', proofMimeType: '', videoFileId: '', videoMimeType: '' };

      function advance(label) {
        step++;
        var pct = Math.round((step / totalSteps) * 100);
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-percent').textContent = pct + '%';
        document.getElementById('progress-status').textContent = label;
      }

      function uploadProof(next) {
        if (!selectedFiles.proof) return next();
        document.getElementById('progress-status').textContent = '上傳證明文件...';
        fileToBase64(selectedFiles.proof, function(base64) {
          callApi('uploadFile', {
            base64: base64,
            fileName: selectedFiles.proof.name,
            mimeType: selectedFiles.proof.type
          }, function(r) {
            uploaded.proofFileId = r.fileId;
            uploaded.proofMimeType = selectedFiles.proof.type;
            advance('證明文件上傳完成');
            next();
          }, function(err) { fail('證明文件上傳失敗: ' + err); });
        });
      }

      function uploadVideo(next) {
        if (!selectedFiles.video) return next();
        document.getElementById('progress-status').textContent = '上傳影音檔案...';
        fileToBase64(selectedFiles.video, function(base64) {
          callApi('uploadFile', {
            base64: base64,
            fileName: selectedFiles.video.name,
            mimeType: selectedFiles.video.type
          }, function(r) {
            uploaded.videoFileId = r.fileId;
            uploaded.videoMimeType = selectedFiles.video.type;
            advance('影音檔案上傳完成');
            next();
          }, function(err) { fail('影音檔案上傳失敗: ' + err); });
        });
      }

      function createRecord() {
        document.getElementById('progress-status').textContent = '建立作品紀錄...';
        callApi('createWork', {
          title: title,
          studentName: studentName,
          description: description,
          category: category,
          proofFileId: uploaded.proofFileId,
          proofMimeType: uploaded.proofMimeType,
          videoFileId: uploaded.videoFileId,
          videoMimeType: uploaded.videoMimeType,
          externalLink: externalLink
        }, function(result) {
          advance('上傳完成！');
          // 清除快取，避免顯示舊資料
          try { sessionStorage.removeItem('sslp_indexWorks'); } catch(e) {}
          try { sessionStorage.removeItem('sslp_myWorks'); } catch(e) {}
          showUploadSuccess(result.id);
        }, function(err) { fail('建立失敗: ' + err); });
      }

      function fail(msg) {
        alert(msg);
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('submit-btn').innerHTML = '<i class="fas fa-paper-plane"></i> 上傳作品';
        document.getElementById('upload-progress').style.display = 'none';
      }

      uploadProof(function() {
        uploadVideo(function() {
          createRecord();
        });
      });
    }

    function showUploadSuccess(workId) {
      var baseUrl = getBaseUrl();
      var container = document.querySelector('[style*="background:white"]');
      container.innerHTML = '' +
        '<div class="text-center py-8">' +
          '<i class="fas fa-check-circle text-green-500 text-6xl mb-4" style="display:block;"></i>' +
          '<h2 class="text-xl font-bold text-gray-800 mb-2">上傳成功！</h2>' +
          '<div style="display:flex; flex-direction:column; gap:12px; align-items:center;">' +
            '<a href="' + baseUrl + '?page=viewer&id=' + workId + '" target="_top" class="btn-primary" style="text-decoration:none; width:200px; justify-content:center;"><i class="fas fa-eye"></i> 查看作品</a>' +
            '<a href="' + baseUrl + '?page=my-works" target="_top" class="btn-secondary" style="text-decoration:none; width:200px; text-align:center;"><i class="fas fa-folder-open mr-1"></i> 我的作品</a>' +
            '<a href="' + baseUrl + '?page=upload" target="_top" class="btn-secondary" style="text-decoration:none; width:200px; text-align:center;"><i class="fas fa-plus mr-1"></i> 繼續上傳</a>' +
          '</div>' +
        '</div>';
    }
  </script>
</body>
</html>
