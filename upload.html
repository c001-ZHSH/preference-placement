<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('styles') ?>
</head>
<body>
  <?!= include('components') ?>

  <div class="max-w-2xl mx-auto px-4 py-8">
    <!-- 標題 -->
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-1">
        <i class="fas fa-cloud-upload-alt mr-2 text-blue-500"></i>上傳學習成果
      </h1>
      <p class="text-gray-500">分享你的自主學習成果，支援 PDF 文件及影片檔案。</p>
    </div>

    <!-- 上傳表單 -->
    <div style="background:white; border-radius:16px; padding:32px; box-shadow:0 2px 12px rgba(0,0,0,0.08);">

      <!-- 步驟 1：選擇檔案 -->
      <div id="step-file" class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-2">
          <span class="bg-blue-100 text-blue-700 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-1">1</span>
          選擇檔案
        </label>
        <div class="upload-zone" id="upload-zone"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDrop(event)">
          <i class="fas fa-cloud-upload-alt text-5xl text-gray-300 mb-4" style="display:block;"></i>
          <p class="text-gray-500 mb-2">拖拉檔案至此處，或</p>
          <button class="btn-primary" onclick="document.getElementById('file-input').click()">
            <i class="fas fa-folder-open"></i> 選擇檔案
          </button>
          <input type="file" id="file-input" accept=".pdf,.mp4,.mov,.webm,.avi"
                 onchange="handleFileSelect(this)" style="display:none;">
          <p class="text-xs text-gray-400 mt-3">支援格式：PDF、MP4、MOV、WebM、AVI（最大 50MB）</p>
          <p class="text-xs text-orange-400 mt-1"><i class="fas fa-lightbulb mr-1"></i>建議影片使用 <strong>MP4 格式</strong>，相容性最佳</p>
        </div>

        <!-- 已選擇的檔案資訊 -->
        <div id="file-info" style="display:none;"
             class="mt-3 flex items-center gap-3 p-3 bg-green-50 rounded-12 border border-green-200"
             style="border-radius:12px;">
          <i id="file-info-icon" class="fas fa-file text-2xl text-green-600"></i>
          <div class="flex-1">
            <p class="font-medium text-gray-800" id="file-info-name"></p>
            <p class="text-sm text-gray-500" id="file-info-size"></p>
          </div>
          <button class="text-gray-400 hover:text-red-500" onclick="clearFile()" title="移除檔案">
            <i class="fas fa-times-circle text-xl"></i>
          </button>
        </div>
      </div>

      <!-- 步驟 2：成果類別 -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-2">
          <span class="bg-blue-100 text-blue-700 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-1">2</span>
          成果類別 <span class="text-red-500">*</span>
        </label>
        <select id="work-category" class="form-input">
          <option value="">-- 請選擇成果類別 --</option>
        </select>
      </div>

      <!-- 步驟 3：作品標題 -->
      <div class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-2">
          <span class="bg-blue-100 text-blue-700 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-1">3</span>
          作品標題 <span class="text-red-500">*</span>
        </label>
        <input type="text" id="work-title" class="form-input" placeholder="請輸入作品標題" maxlength="100">
      </div>

      <div class="mb-8">
        <label class="block text-sm font-bold text-gray-700 mb-2">
          <span class="bg-blue-100 text-blue-700 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs mr-1">4</span>
          作品說明
        </label>
        <textarea id="work-description" class="form-input" rows="4"
                  placeholder="簡單介紹你的學習成果，例如：學習動機、過程、心得..." maxlength="1000"></textarea>
        <p class="text-xs text-gray-400 mt-1 text-right">
          <span id="desc-count">0</span> / 1000
        </p>
      </div>

      <!-- 上傳進度 -->
      <div id="upload-progress" style="display:none;" class="mb-6">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium text-gray-700">上傳中...</span>
          <span class="text-sm text-gray-500" id="progress-percent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <!-- 提交按鈕 -->
      <button class="btn-primary w-full justify-center text-base py-3" id="submit-btn" onclick="submitWork()">
        <i class="fas fa-paper-plane"></i> 上傳作品
      </button>
    </div>
  </div>

  <?!= include('app.js') ?>

  <script>
    var selectedFile = null;

    // 載入類別選單
    function onUserLoaded(user) {
      callApi('getCategories', {}, function(cats) {
        var select = document.getElementById('work-category');
        cats.forEach(function(cat) {
          var opt = document.createElement('option');
          opt.value = cat.name;
          opt.textContent = cat.name;
          select.appendChild(opt);
        });
      });
    }

    // 文字計數
    document.getElementById('work-description').addEventListener('input', function() {
      document.getElementById('desc-count').textContent = this.value.length;
    });

    // === 檔案選擇 ===
    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        validateAndSetFile(input.files[0]);
      }
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('upload-zone').classList.add('dragover');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('upload-zone').classList.remove('dragover');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('upload-zone').classList.remove('dragover');

      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        validateAndSetFile(e.dataTransfer.files[0]);
      }
    }

    function validateAndSetFile(file) {
      // 檢查檔案大小（50MB）
      var maxSize = 50 * 1024 * 1024;
      if (file.size > maxSize) {
        showToast('檔案大小超過 50MB 限制，請壓縮後再試', 'error');
        return;
      }

      // 檢查檔案類型
      var allowedTypes = [
        'application/pdf',
        'video/mp4', 'video/quicktime', 'video/webm', 'video/x-msvideo'
      ];
      if (allowedTypes.indexOf(file.type) === -1) {
        showToast('不支援的檔案格式，請上傳 PDF 或影片檔', 'error');
        return;
      }

      selectedFile = file;

      // 顯示檔案資訊
      var isPdf = file.type === 'application/pdf';
      document.getElementById('file-info-icon').className = isPdf
        ? 'fas fa-file-pdf text-2xl text-red-500'
        : 'fas fa-video text-2xl text-purple-500';
      document.getElementById('file-info-name').textContent = file.name;
      document.getElementById('file-info-size').textContent = formatFileSize(file.size);
      document.getElementById('file-info').style.display = 'flex';
      document.getElementById('upload-zone').style.display = 'none';
    }

    function clearFile() {
      selectedFile = null;
      document.getElementById('file-input').value = '';
      document.getElementById('file-info').style.display = 'none';
      document.getElementById('upload-zone').style.display = '';
    }

    // === 提交作品 ===
    function submitWork() {
      var category = document.getElementById('work-category').value;
      var title = document.getElementById('work-title').value.trim();
      var description = document.getElementById('work-description').value.trim();
      var studentName = currentUser ? currentUser.name : '';

      // 驗證
      if (!selectedFile) {
        showToast('請先選擇檔案', 'error');
        return;
      }
      if (!category) {
        showToast('請選擇成果類別', 'error');
        return;
      }
      if (!title) {
        showToast('請輸入作品標題', 'error');
        return;
      }

      // 停用按鈕
      document.getElementById('submit-btn').disabled = true;
      document.getElementById('submit-btn').innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;"></div> 上傳中...';

      // 顯示進度
      document.getElementById('upload-progress').style.display = '';
      simulateProgress();

      // 轉 Base64 並上傳
      fileToBase64(selectedFile, function(base64) {
        // 步驟 1：上傳檔案到 Drive
        updateProgress(40, '上傳檔案中...');
        callApi('uploadFile', {
          base64: base64,
          fileName: selectedFile.name,
          mimeType: selectedFile.type
        }, function(fileResult) {
          // 步驟 2：建立作品記錄
          updateProgress(80, '建立作品記錄...');
          var fileType = selectedFile.type === 'application/pdf' ? 'pdf' : 'video';

          callApi('createWork', {
            title: title,
            studentName: studentName,
            description: description,
            fileType: fileType,
            driveFileId: fileResult.fileId,
            category: category
          }, function(workResult) {
            updateProgress(100, '上傳完成！');
            showUploadSuccess(workResult.id);

          }, function(err) {
            resetSubmitBtn();
            showToast('建立作品失敗: ' + err, 'error');
          });

        }, function(err) {
          resetSubmitBtn();
          showToast('檔案上傳失敗: ' + err, 'error');
        });
      });
    }

    function simulateProgress() {
      var fill = document.getElementById('progress-fill');
      var percent = document.getElementById('progress-percent');
      var value = 0;
      var timer = setInterval(function() {
        value += Math.random() * 8;
        if (value > 35) { clearInterval(timer); return; }
        fill.style.width = value + '%';
        percent.textContent = Math.round(value) + '%';
      }, 200);
    }

    function updateProgress(value, text) {
      document.getElementById('progress-fill').style.width = value + '%';
      document.getElementById('progress-percent').textContent = value + '%';
    }

    function showUploadSuccess(workId) {
      var baseUrl = getBaseUrl();
      var viewUrl = baseUrl + '?page=viewer&id=' + workId;
      var myWorksUrl = baseUrl + '?page=my-works';

      // 替換整個表單為成功畫面
      var container = document.querySelector('[style*="background:white"]');
      container.innerHTML = '' +
        '<div class="text-center py-8">' +
          '<i class="fas fa-check-circle text-green-500 text-6xl mb-4" style="display:block;"></i>' +
          '<h2 class="text-xl font-bold text-gray-800 mb-2">上傳成功！</h2>' +
          '<p class="text-gray-500 mb-6">你的作品已成功上傳，可以前往查看。</p>' +
          '<div style="display:flex; flex-direction:column; gap:12px; align-items:center;">' +
            '<a href="' + viewUrl + '" target="_top" class="btn-primary" style="text-decoration:none; width:200px; justify-content:center;">' +
              '<i class="fas fa-eye"></i> 查看作品' +
            '</a>' +
            '<a href="' + myWorksUrl + '" target="_top" class="btn-secondary" style="text-decoration:none; width:200px; text-align:center;">' +
              '<i class="fas fa-folder-open mr-1"></i> 我的作品' +
            '</a>' +
            '<a href="' + baseUrl + '?page=upload" target="_top" class="btn-secondary" style="text-decoration:none; width:200px; text-align:center;">' +
              '<i class="fas fa-plus mr-1"></i> 繼續上傳' +
            '</a>' +
          '</div>' +
        '</div>';
    }

    function resetSubmitBtn() {
      document.getElementById('submit-btn').disabled = false;
      document.getElementById('submit-btn').innerHTML = '<i class="fas fa-paper-plane"></i> 上傳作品';
      document.getElementById('upload-progress').style.display = 'none';
    }
  </script>
</body>
</html>
